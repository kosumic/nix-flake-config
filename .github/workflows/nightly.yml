name: Nightly builds

on:
  schedule:
    - cron: "0 3 * * *"
      timezone: "America/New_York"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-builds
  cancel-in-progress: false

jobs:
  nixos:
    name: Build NixOS (${{ matrix.host }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: savior
            configuration: savior-ci
            runner: ubuntu-latest
          - host: thinker
            configuration: thinker-ci
            runner: ubuntu-latest
          - host: thinkery
            configuration: thinkery
            runner: ubuntu-latest
          - host: oracle
            configuration: oracle
            runner: ubuntu-24.04-arm
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
        with:
          persist-credentials: false

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        with:
          determinate: false

      - name: Cache Nix store
        uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15

      - name: Build system
        run: nix build --no-link --print-build-logs --no-write-lock-file ".#nixosConfigurations.\"${{ matrix.configuration }}\".config.system.build.toplevel"

  home-manager:
    name: Build Home Manager (${{ matrix.profile }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: kosumi
            runner: ubuntu-latest
          - profile: shellhome
            runner: ubuntu-latest
          - profile: shellhomeForWork
            runner: ubuntu-latest
          - profile: cloud-x86_64-linux
            runner: ubuntu-latest
          - profile: cloud-aarch64-linux
            runner: ubuntu-24.04-arm
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
        with:
          persist-credentials: false

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        with:
          determinate: false

      - name: Cache Nix store
        uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15

      - name: Build activation package
        run: nix build --no-link --print-build-logs --no-write-lock-file ".#homeConfigurations.\"${{ matrix.profile }}\".activationPackage"

  darwin:
    name: Build aarch64-darwin development outputs
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
        with:
          persist-credentials: false

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        with:
          determinate: false

      - name: Cache Nix store
        uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15

      - name: Build Darwin checks and development shell
        run: >-
          nix build --no-link --print-build-logs --no-write-lock-file
          .#checks.aarch64-darwin.pre-commit-check
          .#devShells.aarch64-darwin.default
