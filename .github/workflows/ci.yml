name: CI

on:
  pull_request:
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
        with:
          persist-credentials: false

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        with:
          determinate: false

      - name: Run pre-commit checks
        run: nix build --no-link --print-build-logs --no-write-lock-file '.#checks.x86_64-linux.pre-commit-check'

  flake:
    name: Evaluate flake
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
        with:
          persist-credentials: false

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        with:
          determinate: false

      - name: Evaluate every advertised system
        run: nix flake check --no-build --all-systems --show-trace --no-write-lock-file

  eval-home:
    name: Evaluate Home Manager
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
        with:
          persist-credentials: false

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        with:
          determinate: false

      - name: Evaluate configurations
        run: |
          for profile in \
            kosumi \
            shellhome \
            shellhomeForWork \
            cloud-aarch64-linux \
            cloud-x86_64-linux
          do
            echo "::group::$profile"
            nix eval \
              --raw \
              --show-trace \
              --no-write-lock-file \
              ".#homeConfigurations.\"$profile\".activationPackage.drvPath"
            echo
            echo "::endgroup::"
          done

  security:
    name: Security
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        with:
          determinate: false

      - name: Scan Git history for secrets
        run: nix develop --command gitleaks git --redact --no-banner .

      - name: Audit GitHub Actions
        run: nix develop --command zizmor --min-severity medium .github
